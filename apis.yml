aid: vinterior
name: Vinterior
description: 'Vinterior is a UK-based curated online marketplace for vintage, antique, and pre-owned
  furniture and homeware. It connects independent sellers, dealers, and restorers with buyers looking for
  one-of-a-kind pieces, positioning itself as a more sustainable alternative to mass-produced furniture.
  The platform handles product discovery, listings, seller storefronts, checkout, and delivery for
  design-led vintage goods. Vinterior is backed by Seedcamp. As of this profile Vinterior does not publish
  a public developer program, API reference, or machine-readable API surface; this record is maintained in
  the API Evangelist network as a company profile and enrichment lead.'
